version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: nextdrop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextdrop_db
      POSTGRES_USER: nextdrop_user
      POSTGRES_PASSWORD: nextdrop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextdrop_user -d nextdrop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (Celery Broker + Result Backend)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nextdrop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextdrop_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nextdrop_user:nextdrop_password@db:5432/nextdrop_db
      DATABASE_SYNC_URL: postgresql+psycopg2://nextdrop_user:nextdrop_password@db:5432/nextdrop_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------------------
  # Celery Worker (background ML training tasks)
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextdrop_celery
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nextdrop_user:nextdrop_password@db:5432/nextdrop_db
      DATABASE_SYNC_URL: postgresql+psycopg2://nextdrop_user:nextdrop_password@db:5432/nextdrop_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    command: celery -A app.worker worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
  redis_data:
